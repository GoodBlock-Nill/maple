<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>이메일 인증번호</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #0b1642">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #0b1642; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 520px;
              background-color: #ffffff;
              border-radius: 20px;
              padding: 40px 32px;
              font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif;
            "
          >
            <tr>
              <td style="font-size: 20px; font-weight: 700; color: #2a2a2a; padding-bottom: 8px">
                글자월드
              </td>
            </tr>
            <tr>
              <td style="font-size: 24px; font-weight: 700; color: #111111; padding-bottom: 12px">
                이메일 인증번호
              </td>
            </tr>
            <tr>
              <td style="font-size: 15px; line-height: 1.6; color: #666666; padding-bottom: 24px">
                요청하신 인증번호입니다. 진행 중이던 화면에 그대로 입력해 주세요.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom: 24px">
                <div
                  style="
                    background-color: #fafafa;
                    border: 1px solid #d5d9df;
                    border-radius: 12px;
                    padding: 20px 0;
                  "
                >
                  <div style="font-size: 13px; color: #666666; padding-bottom: 8px">인증번호</div>
                  <div
                    style="font-size: 36px; font-weight: 700; letter-spacing: 8px; color: #111111"
                  >
                    {{ .Token }}
                  </div>
                </div>
              </td>
            </tr>
            <tr>
              <td style="font-size: 14px; line-height: 1.6; color: #666666; padding-bottom: 24px">
                인증번호는 발급 후 1시간 동안만 쓸 수 있습니다. 번호를 직접 입력하기 어렵다면 아래
                버튼을 눌러 주세요.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom: 24px">
                <a
                  href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=magiclink&amp;next=/auth/onboarding"
                  style="
                    display: inline-block;
                    background-color: #111111;
                    color: #ffffff;
                    text-decoration: none;
                    font-size: 16px;
                    font-weight: 600;
                    padding: 16px 32px;
                    border-radius: 32px;
                  "
                  >인증하고 계속하기</a
                >
              </td>
            </tr>
            <tr>
              <td
                style="
                  font-size: 12px;
                  line-height: 1.6;
                  color: #9a9a9a;
                  border-top: 1px solid #e5e8ef;
                  padding-top: 20px;
                "
              >
                버튼이 열리지 않으면 이 주소를 붙여넣어 주세요.<br />
                <span style="color: #666666; word-break: break-all">{{ .ConfirmationURL }}</span>
              </td>
            </tr>
            <tr>
              <td style="font-size: 12px; line-height: 1.6; color: #9a9a9a; padding-top: 16px">
                본인이 요청하지 않았다면 이 메일을 무시하셔도 됩니다.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
